<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Class Details - Development Hub LMS</title>
    <link rel="icon" type="image/png" href="../favicon.png">

    <link
        rel="stylesheet"
        href="class-details.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="top-header">

        <div>

            <h1>Development Hub LMS</h1>

            <p>Admin Panel</p>

        </div>


        <button
            id="logoutBtn"
            class="logout-btn"
        >
            Logout
        </button>

    </header>



    <!-- MAIN -->

    <main class="page-container">


        <div class="back-row">

            <a href="classes.html">
                ← Back to Classes
            </a>
            <a href="dashboard.html" class="back-dashboard-link">
                Back to Admin Dashboard
            </a>

        </div>



        <!-- CLASS INFORMATION -->

        <section class="class-header">

            <div>

                <h2 id="className">
                    Loading class...
                </h2>

                <p id="classDescription">
                    Loading description...
                </p>

            </div>


            <span
                id="classStatus"
                class="status-active"
            >
                Active
            </span>

        </section>



        <div id="message"></div>



        <!-- FACILITATOR -->

        <section class="section-card">

            <div class="section-title">

                <div>

                    <h3>Class Facilitator</h3>

                    <p>
                        Assign a facilitator to this class.
                    </p>

                </div>

            </div>


            <div class="form-row">

                <select id="facilitatorSelect">

                    <option value="">
                        Select Facilitator
                    </option>

                </select>


                <button
                    id="assignFacilitatorBtn"
                    class="primary-btn"
                >
                    Assign Facilitator
                </button>

            </div>


            <p id="facilitatorMessage"></p>

        </section>



        <!-- STUDENTS -->

        <section class="section-card">

            <div class="section-title">

                <div>

                    <h3>
                        Students
                        (<span id="studentCount">0</span>)
                    </h3>

                    <p>
                        Add students to this class.
                    </p>

                </div>

            </div>



            <!-- ADD STUDENT -->

            <div class="form-row">

                <select id="studentSelect">

                    <option value="">
                        Select Student
                    </option>

                </select>


                <button
                    id="addStudentBtn"
                    class="primary-btn"
                >
                    Add Student
                </button>

            </div>


            <p id="studentMessage"></p>



            <!-- STUDENTS TABLE -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>S/N</th>

                            <th>Student ID</th>

                            <th>Student Name</th>

                            <th>Phone</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="studentsTable">

                        <tr>

                            <td colspan="5">
                                Loading students...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>


    </main>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="../js/supabase.js"></script>

    <script src="class-details.js"></script>


</body>

</html>
