<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Classes - Development Hub LMS</title>
    <link rel="icon" type="image/png" href="../favicon.png">

    <link
        rel="stylesheet"
        href="classes.css"
    >
    <link rel="stylesheet" href="../css/responsive-table.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-header">

        <div>

            <h1>Development Hub LMS</h1>

            <p>Admin Panel</p>

        </div>


        <button
            id="logoutBtn"
            class="logout-btn"
        >
            Logout
        </button>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="page-container">

        <div class="back-row">
            <a href="dashboard.html">&larr; Back to Admin Dashboard</a>
        </div>


        <!-- PAGE HEADING -->

        <div class="page-heading">

            <div>

                <h2>Manage Classes</h2>

                <p>
                    Create and manage Development Hub classes.
                </p>

            </div>


            <button
                id="addClassBtn"
                class="primary-btn"
            >
                + Add Class
            </button>

        </div>



        <!-- MESSAGE -->

        <div id="message"></div>



        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search class..."
            >

        </div>



        <!-- CLASS TABLE -->

        <div class="table-container">

            <table class="stack-mobile">

                <thead>

                    <tr>

                        <th>S/N</th>

                        <th>Class Name</th>

                        <th>Description</th>

                        <th>Facilitator</th>

                        <th>Students</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="classesTable">

                    <tr>

                        <td colspan="7">
                            Loading classes...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </main>



    <!-- =========================
         ADD CLASS MODAL
    ========================== -->

    <div
        id="classModal"
        class="modal"
    >

        <div class="modal-content">


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <h2>Create Class</h2>

                <button
                    id="closeModal"
                    class="close-btn"
                >
                    &times;
                </button>

            </div>



            <!-- FORM -->

            <form id="classForm">


                <label for="className">
                    Class Name
                </label>

                <input
                    type="text"
                    id="className"
                    placeholder="Example: Web Technology 1"
                    required
                >



                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Enter a short description of the class"
                    rows="4"
                ></textarea>



                <button
                    type="submit"
                    class="primary-btn full-width"
                >
                    Create Class
                </button>


            </form>


            <p id="formMessage"></p>


        </div>

    </div>



    <!-- DELETE / ARCHIVE CLASS DIALOG -->

    <div id="deleteModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="deleteTitle">Delete Class</h2>
                <button id="closeDeleteModal" class="close-btn" type="button" aria-label="Close">&times;</button>
            </div>

            <p id="deleteClassName" class="delete-class-name"></p>

            <div id="deleteBody" class="delete-body" aria-live="polite"></div>

            <div class="dialog-actions">
                <button id="cancelDeleteBtn" class="secondary-btn" type="button">Cancel</button>
                <button id="archiveClassBtn" class="action-btn" type="button" hidden></button>
                <button id="confirmDeleteBtn" class="danger-btn" type="button" hidden>Delete permanently</button>
            </div>

        </div>

    </div>

    <!-- =========================
         SUPABASE
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="../js/supabase.js"></script>


    <script src="../js/responsive-table.js"></script>
    <script src="classes.js"></script>


</body>

</html>
